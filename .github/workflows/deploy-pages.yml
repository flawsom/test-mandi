name: Deploy Landing + Docs to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "landing/**"
      - "docs/**"
      - "static/**"
      - "dashboards/omega-field.html"   # standalone 3D quantum field page
      - "mandi_rdd/data/**"   # DuckDB — landing/docs KPI freshness reads live data
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare deploy artifact
        run: |
          mkdir -p _site/docs
          # ── Landing page → root (/). Relative links like ../docs/
          #    resolve to /docs/ which matches the docs subdirectory. ──
          cp -r landing/index.html _site/
          if [ -d landing/mandi-iq ]; then
            cp -r landing/mandi-iq _site/
          fi
          # ── Docs → /docs/ (except SEO files that crawlers need at root) ──
          if [ -d docs ]; then
            for f in docs/*; do
              [ -e "$f" ] || continue
              base="$(basename "$f")"
              case "$base" in
                robots.txt|sitemap.xml) cp "$f" _site/ ;;
                *) cp -r "$f" _site/docs/ ;;
              esac
            done
            # Also copy .nojekyll from docs root if present
            [ -f docs/.nojekyll ] && cp docs/.nojekyll _site/
          fi
          # ── Root-level static assets (robots.txt, sitemap-*.xml, cursor-effect.js) ──
          if [ -d static ]; then
            for f in static/*; do
              [ -e "$f" ] && cp "$f" _site/
            done
          fi
          # ── Standalone 3D quantum field → /dashboards/omega-field.html ──
          if [ -f dashboards/omega-field.html ]; then
            mkdir -p _site/dashboards
            cp dashboards/omega-field.html _site/dashboards/
          fi
          # .nojekyll prevents Jekyll processing
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        name: Deploy
        uses: actions/deploy-pages@v4
