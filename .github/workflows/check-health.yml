# Multi-surface health check for MandiIQ.
#
# Runs on a schedule (every 6 hours) and after every deploy-vercel and
# deploy-pages workflow completes.  Curls all 4 deployed surfaces, verifies
# each serves live data with 1M+ prices, and fails the check if any surface
# is stale or down.
#
# The health check script (scripts/check_health.py) is stdlib-only so it
# runs directly on the ubuntu runner with no pip install needed.

name: Multi-Surface Health Check

on:
  schedule:
    - cron: '0 */6 * * *'         # every 6 hours
  workflow_run:
    workflows:
      - "Deploy API to Vercel"
      - "Deploy Landing + Docs to GitHub Pages"
      - "Deploy Edge Worker to Cloudflare"
      - "Hourly DuckDB Sync + Redeploy"
    types:
      - completed
  workflow_dispatch:               # manual trigger via GitHub UI

concurrency:
  group: check-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run multi-surface health check
        id: health
        run: |
          python scripts/check_health.py 2>&1 | tee /tmp/health_output.txt

      - name: Post status check
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONCLUSION=$(python scripts/check_health.py >/dev/null 2>&1 && echo "success" || echo "failure")
          SUMMARY=$(head -30 /tmp/health_output.txt)
          # Post a check run on the latest commit
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/check-runs" \
            -d "$(cat <<ENDJSON
          {
            "name": "Multi-Surface Health Check",
            "head_sha": "${{ github.sha }}",
            "status": "completed",
            "conclusion": "$CONCLUSION",
            "output": {
              "title": "Health Check $CONCLUSION",
              "summary": $(echo "$SUMMARY" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")
            }
          }
          ENDJSON
          )"