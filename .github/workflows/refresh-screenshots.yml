# MandiIQ — Refresh README Screenshots
#
# Keeps the README gallery (screenshots/landing.png, dashboard_home.png,
# api_docs.png) in sync with the live deployed surfaces:
#
#   1. Captures full-page screenshots of the three live surfaces via
#      Playwright headless Chromium (scripts/_capture_screenshots.mjs).
#      Captures are DETERMINISTIC — reducedMotion:'reduce' + a blanket
#      animation freeze (finite animations finish, infinite ones cancel to
#      base style), full-page scroll-through so IntersectionObserver
#      reveals settle, and live timestamp meta-elements removed — so a
#      git diff only fires on REAL content changes (KPI counts, layout,
#      API spec), never on animation phase or clock drift.
#   2. Optimizes the raw captures into the committed gallery PNGs
#      (scripts/optimize_screenshots.py — downscale to 1280px +
#      MEDIANCUT-256 quantization, so the repo stays lean).
#   3. Commits the diff back to master ONLY when the optimized images
#      actually changed (binary diff gate) — no churn when the pages
#      are unchanged — and pushes with rebase to stay in sync.
#
# The capture script exits non-zero if any surface fails (after 2
# retries), so a stale/partial gallery is never committed.

name: Refresh README Screenshots

on:
  schedule:
    - cron: "17 4 * * *"      # daily 04:17 UTC — after the hourly sync, before peak usage
  workflow_dispatch: {}        # manual "Run workflow" from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-screenshots
  cancel-in-progress: false    # never cancel a run mid-push (matches hourly-duckdb-sync)

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # diff against the committed screenshots

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright + Chromium
        run: |
          npm install playwright 2>&1 | tail -3
          npx playwright install chromium --with-deps 2>&1 | tail -5
          echo "playwright $(npx playwright --version)"

      - name: Capture live screenshots
        run: |
          mkdir -p .browser_shots
          node scripts/_capture_screenshots.mjs
          ls -la .browser_shots/

      - name: Upload raw captures artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-raw-captures
          path: .browser_shots/
          include-hidden-files: true   # v4 excludes hidden dirs by default
          if-no-files-found: warn
          retention-days: 14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Optimize into committed gallery PNGs
        run: |
          python -m pip install --quiet pillow
          python scripts/optimize_screenshots.py

      - name: Upload optimized gallery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-gallery
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit if screenshots changed
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet -- screenshots/; then
            echo "::notice::Screenshots unchanged — no commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screenshots/
          git commit -m "chore: refresh README screenshots ($(date -u +%Y-%m-%dT%H:%M:%SZ))" || { echo "nothing to commit"; exit 0; }
          git pull --rebase origin master 2>&1 || true
          git push origin master 2>&1 || echo "::warning::screenshots push failed — README gallery may be stale until the next run"
          echo "::notice::README screenshots refreshed and committed"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "committed=${{ steps.commit.outputs.committed }}"
