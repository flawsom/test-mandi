# Config validation on every push to master.
#
# The API formerly deployed to Render via a deploy hook; it now runs on
# Northflank and reads its DuckDB from the /data volume (kept fresh by the
# hourly cron + R2 restore), so there is no Render deploy to trigger.
# This workflow validates the deployment configuration files instead.

name: Config Validation

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: config-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Northflank config
        run: python scripts/validate_northflank_config.py

      - name: Validate render.yaml + DuckDB
        uses: ./.github/actions/validate-all
