# MandiIQ — Hourly DuckDB Sync + Redeploy
#
# Runs the hourly ingestion (run_hourly.py) on a schedule in GitHub Actions,
# detects whether the DATA actually changed — the DuckDB's row counts + max
# date (NOT raw file bytes, so spurious DuckDB churn never triggers a commit)
# OR the ndvi_latest.json records payload (record count + content hash of the
# records list, deliberately EXCLUDING the last_updated timestamp so identical
# data never churns commits) — and when it did:
#   1. Commits the refreshed DuckDB + the FULL live artifact set (ndvi_latest.json,
#      last_hourly_run.json, last_ingest_status.json, last_step_timings.json,
#      last_integrity_check.json, _ingestion_progress.json, _integrity_history.json,
#      _last_full_analysis.txt, r2_backup_metrics.json, analysis PNGs, pipeline
#      diagrams) back to master (Git LFS) — artifacts always ride along with the
#      DB so they can never drift from it
#   2. Pushes with --force-with-lease (safe for bot-only binary commits)
#   3. Triggers every deployment surface:
#        - Vercel:   gh workflow run deploy-vercel.yml
#        - Pages:    gh workflow run deploy-pages.yml
#        - Streamlit: auto-deploys from master via its own GitHub webhook
#   4. Restores the fresh DB onto the Northflank volume via
#      POST /admin/restore-from-r2 (R2-as-data-bus — see the NOTE below)
#
# NOTE: The legacy "Trigger Render deploy" step (POST to the API's /deploy,
# which proxied to a Render deploy hook) was REMOVED — the API now runs on
# Northflank (not Render). This workflow's R2 backup is the data-bus: after
# every committed change it POSTs /admin/restore-from-r2 so the fresh
# GH-committed DB also lands on the Northflank /data volume — closing the
# R2-as-data-bus loop automatically.
#
# NOTE on redeploys: commits made with the default GITHUB_TOKEN do NOT
# re-trigger other workflows (GitHub anti-recursion), so this workflow
# explicitly dispatches Vercel + Pages. Streamlit
# is a webhook consumer and redeploys on any push to master automatically.
#
# REQUIRED SECRETS (repo Settings → Secrets and variables → Actions):
#   DATA_GOV_IN_API_KEY   — data.gov.in API key (for fresh prices)
#   VERCEL_TOKEN          — only needed for the Vercel deploy step
#   R2_*                  — optional; guards R2 backup/verify steps
#   SENTINEL_*            — optional; for NDVI during the 24h full run
#
# Without DATA_GOV_IN_API_KEY the ingest step still runs (analysis on the
# committed DB) but fetches 0 new rows, so no commit/redeploy is emitted.

name: Hourly DuckDB Sync + Redeploy

on:
  schedule:
    - cron: "30 * * * *"      # hourly at :30 — after the Northflank :00 cron and API refresh
  workflow_dispatch: {}        # manual "Run workflow" from the Actions tab

permissions:
  contents: write
  actions: write               # needed for `gh workflow run` of Vercel/Pages

concurrency:
  group: hourly-duckdb-sync
  cancel-in-progress: false    # never cancel a run mid-push (binary LFS race safety)

env:
  # GitHub Actions does not allow secrets.* inside `if:` conditions, so the
  # token is exposed via job env and the Vercel step gates on env.VERCEL_TOKEN.
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  # NEVER smudge/push LFS blobs: the committed mandi_iq.duckdb (151MB) exceeded
  # the free git-LFS quota, so `git lfs fetch` aborts the checkout and
  # run_hourly.py never runs (root cause of stale data). The DB is now a
  # runtime artifact delivered via the R2 data-bus + Northflank /data volume,
  # restored by duckdb_store.resolve_db_path()/get_connection(); it is NOT
  # committed to git each hour.
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_LFS_SKIP_PUSH: "1"
  GIT_LFS_SKIP_DOWNLOAD: "1"
  # Northflank API that owns the /data volume — the restore target below.
  API_BASE: "https://p01--mandiiq--zbvjrztgjqgw.code.run"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false            # do NOT smudge the 151MB LFS DB (quota-exceeded
                                # LFS fetch aborts the checkout & blocks ingestion).
                                # GIT_LFS_SKIP_SMUDGE is belt-and-suspenders; the
                                # DB itself is restored/built at runtime instead.

      - name: Validate render.yaml
        uses: ./.github/actions/validate-render

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Snapshot committed DB + NDVI artifact + metadata signature
        id: snapshot
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import duckdb

          TABLES = ("prices", "rainfall", "rdd_results", "ndvi", "forecast_metrics")

          def signature(path):
              if not os.path.exists(path):
                  return ""
              try:
                  conn = duckdb.connect(path, read_only=True)
              except Exception:
                  # Stale git-LFS pointer (checkout lfs:false) or not a real
                  # DuckDB file yet — treat as "no committed DB" so the run
                  # proceeds to ingestion/restore instead of crashing.
                  return ""
              try:
                  parts = []
                  for t in TABLES:
                      try:
                          n = conn.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0]
                          parts.append(f"{t}={n}")
                      except Exception:
                          parts.append(f"{t}=n/a")
                  try:
                      parts.append(
                          "max_date=" + str(conn.execute(
                              "SELECT MAX(arrival_date) FROM prices"
                          ).fetchone()[0])
                      )
                  except Exception:
                      pass
                  return "|".join(parts)
              finally:
                  conn.close()

          def ndvi_signature(path):
              # Stable signature of ndvi_latest.json: record count + SHA-256 of
              # the records payload ONLY. Deliberately excludes the top-level
              # "last_updated" timestamp (churns every run) so a re-export of
              # identical data never triggers a commit, while a real NDVI
              # records change always does.
              if not os.path.exists(path):
                  return ""
              try:
                  with open(path, encoding="utf-8") as f:
                      data = json.load(f)
                  recs = data.get("records", []) if isinstance(data, dict) else data
                  # Normalize list order too: the Sentinel fetch is paged and
                  # ordering can vary between runs, so identical data must hash
                  # identically. sort_keys handles keys; this handles rows.
                  recs = sorted(recs, key=lambda r: json.dumps(r, sort_keys=True, default=str))
                  payload = json.dumps(recs, sort_keys=True, default=str)
                  return "ndvi_records=%d|ndvi_hash=%s" % (
                      len(recs),
                      hashlib.sha256(payload.encode()).hexdigest()[:16],
                  )
              except Exception as exc:
                  return "ndvi_err=" + type(exc).__name__

          def metadata_signature(path):
              # Signature for last_hourly_run.json — use the last_run_utc timestamp
              # so a fresh hourly run always counts as a change even if DB rows
              # didn't increase. This ensures Northflank metadata stays current.
              if not os.path.exists(path):
                  return ""
              try:
                  with open(path, encoding="utf-8") as f:
                      data = json.load(f)
                  # Use last_run_utc as the change signal
                  ts = data.get("last_run_utc", "")
                  return f"last_hourly_run_ts={ts}"
              except Exception:
                  return ""

          with open("sig_before.txt", "w") as f:
              f.write(signature("mandi_rdd/data/mandi_iq.duckdb"))
          with open("sig_ndvi_before.txt", "w") as f:
              f.write(ndvi_signature("mandi_rdd/data/ndvi_latest.json"))
          with open("sig_meta_before.txt", "w") as f:
              f.write(metadata_signature("mandi_rdd/data/last_hourly_run.json"))
          print("committed signature:", open("sig_before.txt").read() or "(no DB)")
          print("committed NDVI sig: ", open("sig_ndvi_before.txt").read() or "(no ndvi_latest.json)")
          print("committed meta sig: ", open("sig_meta_before.txt").read() or "(no last_hourly_run.json)")
          PY

      - name: Run hourly ingestion
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          SENTINEL_CLIENT_ID: ${{ secrets.SENTINEL_CLIENT_ID }}
          SENTINEL_CLIENT_SECRET: ${{ secrets.SENTINEL_CLIENT_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run_hourly.py || echo "::warning::run_hourly.py exited non-zero — continuing to check for data changes"

      - name: Compare data signature (DB or NDVI artifact or metadata change?)
        id: changed
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import duckdb

          TABLES = ("prices", "rainfall", "rdd_results", "ndvi", "forecast_metrics")

          def signature(path):
              if not os.path.exists(path):
                  return ""
              try:
                  conn = duckdb.connect(path, read_only=True)
              except Exception:
                  # Stale git-LFS pointer (checkout lfs:false) or not a real
                  # DuckDB file yet — treat as "no committed DB" so the run
                  # proceeds to ingestion/restore instead of crashing.
                  return ""
              try:
                  parts = []
                  for t in TABLES:
                      try:
                          n = conn.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0]
                          parts.append(f"{t}={n}")
                      except Exception:
                          parts.append(f"{t}=n/a")
                  try:
                      parts.append(
                          "max_date=" + str(conn.execute(
                              "SELECT MAX(arrival_date) FROM prices"
                          ).fetchone()[0])
                      )
                  except Exception:
                      pass
                  return "|".join(parts)
              finally:
                  conn.close()

          def ndvi_signature(path):
              # Mirrors the snapshot step (must stay identical — it is the
              # before/after comparison key).
              if not os.path.exists(path):
                  return ""
              try:
                  with open(path, encoding="utf-8") as f:
                      data = json.load(f)
                  recs = data.get("records", []) if isinstance(data, dict) else data
                  # Normalize list order too: the Sentinel fetch is paged and
                  # ordering can vary between runs, so identical data must hash
                  # identically. sort_keys handles keys; this handles rows.
                  recs = sorted(recs, key=lambda r: json.dumps(r, sort_keys=True, default=str))
                  payload = json.dumps(recs, sort_keys=True, default=str)
                  return "ndvi_records=%d|ndvi_hash=%s" % (
                      len(recs),
                      hashlib.sha256(payload.encode()).hexdigest()[:16],
                  )
              except Exception as exc:
                  return "ndvi_err=" + type(exc).__name__

          def metadata_signature(path):
              # Mirrors the snapshot step.
              if not os.path.exists(path):
                  return ""
              try:
                  with open(path, encoding="utf-8") as f:
                      data = json.load(f)
                  ts = data.get("last_run_utc", "")
                  return f"last_hourly_run_ts={ts}"
              except Exception:
                  return ""

          before = open("sig_before.txt").read().strip()
          after = signature("mandi_rdd/data/mandi_iq.duckdb")
          ndvi_before = open("sig_ndvi_before.txt").read().strip()
          ndvi_after = ndvi_signature("mandi_rdd/data/ndvi_latest.json")
          meta_before = open("sig_meta_before.txt").read().strip()
          meta_after = metadata_signature("mandi_rdd/data/last_hourly_run.json")
          db_changed = before != after
          ndvi_changed = ndvi_before != ndvi_after
          meta_changed = meta_before != meta_after
          changed = db_changed or ndvi_changed or meta_changed
          print("before:      ", before or "(no DB)")
          print("after:       ", after or "(no DB)")
          print("ndvi before: ", ndvi_before or "(none)")
          print("ndvi after:  ", ndvi_after or "(none)")
          print("meta before: ", meta_before or "(none)")
          print("meta after:  ", meta_after or "(none)")
          print("db_changed:  ", db_changed)
          print("ndvi_changed:", ndvi_changed)
          print("meta_changed:", meta_changed)
          print("changed:     ", changed)
          with open("changed.txt", "w") as f:
              f.write("true" if changed else "false")
          PY
          echo "changed=$(cat changed.txt)" >> "$GITHUB_OUTPUT"
          if [ "$(cat changed.txt)" = "false" ]; then
            echo "::notice::No real data change (DB rows/max-date + NDVI artifact + metadata identical) — skipping commit & redeploy"
          fi

      - name: Regenerate docs pipeline diagram (live counts)
        if: steps.changed.outputs.changed == 'true'
        run: |
          # run_hourly.py already regenerates both diagrams/ and
          # docs/assets/mermaid/pipeline-flow-live.mmd (with live DuckDB
          # counts) on success. This guard is a belt-and-suspenders so the
          # docs .mmd is always fresh even if the analysis path skipped it.
          python scripts/generate_pipeline_diagram.py --docs-output docs/assets/mermaid/pipeline-flow-live.mmd
          echo "::notice::Docs pipeline .mmd regenerated with live counts"

      - name: Set up Node.js (diagram render)
        if: steps.changed.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Mermaid CLI
        if: steps.changed.outputs.changed == 'true'
        run: |
          npm install -g @mermaid-js/mermaid-cli
          echo "mmdc $(mmdc --version)"

      - name: Render docs pipeline SVG
        if: steps.changed.outputs.changed == 'true'
        run: |
          MMD="docs/assets/mermaid/pipeline-flow-live.mmd"
          SVG="docs/assets/svg/pipeline-flow-live.svg"
          if [ ! -f "$MMD" ]; then
            echo "::warning::No docs pipeline diagram source found at $MMD"
            exit 0
          fi
          # Pre-render with the same Alche dark+lime theme + explicit
          # dimensions used for the other docs diagrams, so GitHub renders
          # it full-size on both light and dark mode.
          mmdc \
            -i "$MMD" \
            -o "$SVG" \
            -c docs/assets/mermaid/alche-config.json \
            -p puppeteer.json \
            -b "#0B0F1E" \
            -s 2 \
            -w 1600
          # Sanitize + set explicit width/height from the root viewBox
          # (mmdc emits width="100%" which collapses on GitHub <img>).
          python - "$SVG" <<'PY'
          import re, sys
          path = sys.argv[1]
          t = open(path, encoding="utf-8").read()
          t = re.sub(r"<br(?![ /])", "<br/>", t)  # self-close any unclosed <br>
          m = re.search(r"<svg[^>]*>", t)
          if m:
              root = m.group(0)
              vm = re.search(r'viewBox="(-?[\d.]+) (-?[\d.]+) ([\d.]+) ([\d.]+)"', root)
              if vm:
                  w = str(int(float(vm.group(3))))
                  h = str(int(float(vm.group(4))))
                  root2 = re.sub(r'\s*width="[^"]*"', "", root, count=1)
                  root2 = re.sub(r'\s*height="[^"]*"', "", root2, count=1)
                  root2 = root2.replace("<svg", f'<svg width="{w}" height="{h}"', 1)
                  t = t[:m.start()] + root2 + t[m.end():]
                  print(f"  [svg] set explicit dims {w}x{h}")
          open(path, "w", encoding="utf-8", newline="").write(t)
          PY
          echo "::notice::Docs pipeline SVG rendered: $(wc -c < "$SVG") bytes -> $SVG"

      - name: Validate DuckDB LFS object
        if: steps.changed.outputs.changed == 'true'
        uses: ./.github/actions/validate-duckdb

      - id: commit
        name: Commit refreshed DuckDB
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # NO git-lfs here: the 151MB DuckDB is a runtime artifact shipped via
          # the R2 data-bus + Northflank /data volume, not committed to git.
          # Some files (r2_backup_metrics.json, _last_full_analysis.txt) only exist
          # after later steps / 24h full runs. An unmatched `git add` pathspec is a
          # hard fatal (exit 128) even with --ignore-errors, so guard each path
          # with an existence check before staging.
          # Commit the FULL live artifact set that describes this DB state so
          # the committed artifacts can NEVER drift from the committed DB: the
          # status JSONs (ndvi_latest.json, last_hourly_run.json, ...), analysis
          # PNGs, and live pipeline diagrams all travel with the DuckDB.
          for f in \
            mandi_rdd/data/ndvi_latest.json \
            mandi_rdd/data/last_hourly_run.json \
            mandi_rdd/data/last_ingest_status.json \
            mandi_rdd/data/last_step_timings.json \
            mandi_rdd/data/last_integrity_check.json \
            mandi_rdd/data/_ingestion_progress.json \
            mandi_rdd/data/_integrity_history.json \
            mandi_rdd/data/_last_full_analysis.txt \
            mandi_rdd/data/r2_backup_metrics.json \
            mandi_rdd/data/ndvi_rainfall_analysis.png \
            mandi_rdd/data/district_stress_map.png \
            diagrams/pipeline-flow-live.mmd \
            docs/assets/mermaid/pipeline-flow-live.mmd \
            docs/assets/svg/pipeline-flow-live.svg; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No database changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: hourly duckdb sync artifacts ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            # Force-with-lease: safe for bot-only repo. Artifact JSONs/PNGs only.
            git push --force-with-lease origin master 2>&1
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Redeploy Vercel (read-only API with fresh DB)
        if: steps.commit.outputs.committed == 'true' && env.VERCEL_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-vercel.yml --ref master
          echo "::notice::Vercel deploy workflow dispatched"

      - name: Redeploy GitHub Pages (docs/landing)
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml --ref master
          echo "::notice::GitHub Pages deploy workflow dispatched"

      - name: Backup DuckDB to Cloudflare R2
        if: steps.commit.outputs.committed == 'true'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "::warning::R2 secrets not configured — skipping backup"
            exit 0
          fi
          BACKUP_FILE="/tmp/mandi_iq.duckdb.gz"
          METRICS_FILE="mandi_rdd/data/r2_backup_metrics.json"
          gzip -c mandi_rdd/data/mandi_iq.duckdb > "$BACKUP_FILE"
          if [ ! -s "$BACKUP_FILE" ]; then
            echo "::warning::gzip compression failed — skipping backup"
            rm -f "$BACKUP_FILE"
            exit 0
          fi
          if ! aws s3 cp "$BACKUP_FILE" \
            "s3://${R2_BUCKET}/mandi_iq.duckdb.gz" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --region auto \
            --content-encoding gzip \
            --only-show-errors; then
            echo "::warning::DuckDB R2 backup failed (transient error)"
          else
            # Marker consumed by the restore step below: only restore the
            # volume when THIS run's backup succeeded (never overwrite a
            # newer volume DB with a stale R2 object).
            touch /tmp/r2_backup_ok
            ORIG_SIZE=$(stat -c%s mandi_rdd/data/mandi_iq.duckdb 2>/dev/null || stat -f%z mandi_rdd/data/mandi_iq.duckdb 2>/dev/null)
            GZ_SIZE=$(stat -c%s "$BACKUP_FILE" 2>/dev/null || stat -f%z "$BACKUP_FILE" 2>/dev/null)
            PCT=$(( (ORIG_SIZE - GZ_SIZE) * 100 / ORIG_SIZE ))
            echo "::notice::DuckDB backed up to s3://${R2_BUCKET}/mandi_iq.duckdb.gz (${PCT}% smaller)"
            DB_SHA256=$(sha256sum mandi_rdd/data/mandi_iq.duckdb | cut -d' ' -f1)
            if [ -n "$DB_SHA256" ]; then
              python3 -c "import json; json.dump({'raw_bytes': ${ORIG_SIZE}, 'compressed_bytes': ${GZ_SIZE}, 'compression_pct': ${PCT}, 'sha256': '${DB_SHA256}', 'timestamp_utc': '$(date -u +%Y-%m-%dT%H:%M:%SZ)', 'timestamp_epoch': $(date +%s)}, open('${METRICS_FILE}', 'w'))"
            else
              python3 -c "import json; json.dump({'raw_bytes': ${ORIG_SIZE}, 'compressed_bytes': ${GZ_SIZE}, 'compression_pct': ${PCT}, 'timestamp_utc': '$(date -u +%Y-%m-%dT%H:%M:%SZ)', 'timestamp_epoch': $(date +%s)}, open('${METRICS_FILE}', 'w'))"
            fi
            echo "::notice::R2 backup metrics written to ${METRICS_FILE}"
          fi
          rm -f "$BACKUP_FILE"

      - name: Verify DuckDB backup on R2
        if: steps.commit.outputs.committed == 'true'
        continue-on-error: true
        uses: ./.github/actions/verify-r2-backup
        with:
          bucket: ${{ secrets.R2_BUCKET }}
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          key: "mandi_iq.duckdb.gz"
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Restore fresh DB onto Northflank volume (R2 data-bus)
        if: steps.commit.outputs.committed == 'true'
        continue-on-error: true
        run: |
          if [ ! -f /tmp/r2_backup_ok ]; then
            echo "::warning::R2 backup did not report success this run — skipping volume restore (never overwrite a newer volume DB with a stale R2 object)"
            exit 0
          fi
          echo "Restoring DuckDB onto the Northflank volume via POST ${API_BASE}/admin/restore-from-r2 ..."
          RESPONSE=$(curl -s -X POST "${API_BASE}/admin/restore-from-r2" --max-time 600 2>/dev/null || true)
          echo "$RESPONSE"
          if echo "$RESPONSE" | grep -q '"status": "ok"'; then
            echo "::notice::Volume DB restored from R2 backup — /health should now serve the fresh GH-committed rows"
          else
            echo "::error::Restore response did not report status ok — check the API logs (response above)"
          fi

      - name: Summary
        run: |
          echo "changed=${{ steps.changed.outputs.changed }}"
          echo "committed=${{ steps.commit.outputs.committed }}"
          if [ "${{ steps.changed.outputs.changed }}" = "false" ]; then
            echo "No data change — all surfaces already current."
          else
            echo "Data changed — commit + redeploys triggered."
          fi