# Deploy the read-only FastAPI to Vercel on every push to master.
#
# PREREQUISITES (one-time setup):
#   1. Install Vercel CLI:  npm i -g vercel
#   2. Login:               vercel login
#   3. Link project:        vercel link  (creates .vercel/project.json)
#   4. Create a Vercel token at https://vercel.com/account/tokens
#   5. Add the token as a GitHub secret named VERCEL_TOKEN:
#      https://github.com/flawsom/test-mandi/settings/secrets/actions
#
# IMPORTANT: the Vercel project's Production Branch must be `master`
# (Vercel -> project -> Settings -> Git -> Production Branch). The `gh-pages`
# branch is a pure static site with no FastAPI entrypoint, so Vercel builds of
# that branch fail with "No FastAPI entrypoint found" (see git.deploymentEnabled
# in vercel.json, which disables auto-builds of gh-pages).
#
# WHY: The Vercel serverless function is CORS-correct (FastAPI CORSMiddleware,
# allow_origins=["*"]). In mandi_rdd/api/main.py it wraps the app in LiveProxy
# (gated on Vercel's VERCEL env) which forwards requests server-to-server to
# the Northflank host holding the FULL 1.3M-row hourly DuckDB (Northflank's
# envoy proxy strips CORS for browsers, but not for servers) and streams the
# live response back with echoed ACAO. The Git-LFS-bundled DuckDB is NOT used
# on Vercel (LFS budget exhausted breaks lfs:true checkouts), and full pipeline
# execution lives on Northflank/Render (persistent volume, no 60 s timeout).

name: Deploy API to Vercel

# v2 — cached workflow definition refresh. Do not remove this line.

on:
  push:
    branches: [master]
    paths:
      - "api/**"
      - "mandi_rdd/api/**"
      - "mandi_rdd/storage/**"
      - "mandi_rdd/data/**"   # DuckDB — redeploy API whenever the DB syncs
      - "mandi_rdd/analysis/**"  # scipy-guarded modules; API degrades gracefully
      - "requirements/**"
      - "requirements.txt"    # installCommand pip-installs this (lean file swapped in)
      - "requirements-vercel.txt"
      - "vercel.json"
      - ".python-version"
      - ".github/workflows/deploy-vercel.yml"
      # NOTE (2026-08): pyproject.toml / uv.lock were REMOVED from the repo
      # root — Streamlit Cloud reads those with priority over requirements.txt
      # (its uv.lock lacked plotly → ModuleNotFoundError on Streamlit). Vercel
      # now installs via installCommand from requirements-vercel.txt instead.
  workflow_dispatch:          # manual trigger via GitHub UI

concurrency:
  group: deploy-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate vercel.json is valid JSON
        run: python -c "import json; json.load(open('vercel.json')); print('vercel.json OK')"

      - name: Validate api/index.py imports cleanly
        run: python -c "import ast; ast.parse(open('api/index.py').read()); print('api/index.py OK')"

      - name: Validate .python-version is set
        run: |
          if [ ! -f .python-version ]; then
            echo "::error ::Missing .python-version — create it with '3.12'"
            exit 1
          fi
          echo ".python-version: $(cat .python-version) OK"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      deploy_url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false                          # do NOT pull LFS (budget exhausted);
          # the DB is now served live via the Northflank proxy in main.py,
          # so a bundled DuckDB is not needed in the Vercel function at all.
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
          GIT_LFS_SKIP_FETCH: '1'
          GIT_LFS_SKIP_DOWNLOAD: '1'
          GIT_LFS_SKIP_PUSH: '1'

      - name: Report DB strategy (live proxy, not bundled)
        run: |
          echo "DB strategy: live proxy -> https://p01--mandiiq--zbvjrztgjqgw.code.run"
          if [ -f mandi_rdd/data/mandi_iq.duckdb ]; then
            SIZE=$(stat --format=%s mandi_rdd/data/mandi_iq.duckdb 2>/dev/null || echo 0)
            echo "bundled duckdb (optional fallback): $(numfmt --to=iec $SIZE 2>/dev/null || echo $SIZE B)"
          fi

      - name: Strip .git before deploy (LFS objects would bloat the upload)
        run: |
          du -sh .git 2>/dev/null || true
          rm -rf .git
          echo ".git removed — LFS object store no longer counted in the function bundle"

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Verify VERCEL_TOKEN is configured
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "::error::VERCEL_TOKEN secret is not set — Vercel deploy skipped."
          echo "::error::1. Create a token at https://vercel.com/account/tokens"
          echo "::error::2. Add it as a repo secret: gh secret set VERCEL_TOKEN"
          exit 1

      - name: Write .vercel/project.json (deployment-token flow — link/pull need a user identity)
        if: env.VERCEL_TOKEN != ''
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'EOF'
          {"orgId":"team_DrSClSXxqs4UlleVMuvPOuvX","projectId":"prj_MIMwhXIJMxCdpKRPmljzjFpfaE4i"}
          EOF

      - name: Deploy to production (single command, no user-scope calls)
        id: deploy
        if: env.VERCEL_TOKEN != ''
        run: |
          OUTPUT=$(vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1)
          echo "$OUTPUT"
          # Extract the production URL from the deploy output
          URL=$(echo "$OUTPUT" | grep -oP 'https://[a-zA-Z0-9.-]+\.vercel\.app' | head -1)
          if [ -n "$URL" ]; then
            echo "url=$URL" >> $GITHUB_OUTPUT
          fi

      - name: Smoke-test the deployment
        if: steps.deploy.outputs.deploy_url != ''
        env:
          URL: ${{ steps.deploy.outputs.deploy_url }}
        run: |
          echo "Smoke-testing $URL/health ..."
          # The function proxies to the Northflank live DB (no bundled DB, no
          # R2 download), so the first 200 should be quick even on cold start.
          for i in 1 2 3 4 5 6 7 8; do
            if python scripts/vercel_smoke_test.py "$URL"; then
              echo "OK at attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "::warning ::Smoke-test failed - /health did not serve 1M+ prices after 8 attempts"
          exit 1
        continue-on-error: true               # smoke-test failure is informational
