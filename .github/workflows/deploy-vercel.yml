# Deploy the read-only FastAPI to Vercel on every push to master.
#
# PREREQUISITES (one-time setup):
#   1. Install Vercel CLI:  npm i -g vercel
#   2. Login:               vercel login
#   3. Link project:        vercel link  (creates .vercel/project.json)
#   4. Create a Vercel token at https://vercel.com/account/tokens
#   5. Add the token as a GitHub secret named VERCEL_TOKEN:
#      https://github.com/flawsom/test-mandi/settings/secrets/actions
#
# IMPORTANT: the Vercel project's Production Branch must be `master`
# (Vercel -> project -> Settings -> Git -> Production Branch). The `gh-pages`
# branch is a pure static site with no FastAPI entrypoint, so Vercel builds of
# that branch fail with "No FastAPI entrypoint found" (see git.deploymentEnabled
# in vercel.json, which disables auto-builds of gh-pages).
#
# WHY: The Vercel serverless function exposes a read-only subset of the
# FastAPI endpoints (/health, /prices, /rdd-result, /forecast, /risk-score)
# using the Git-LFS-bundled DuckDB.  Full pipeline execution requires
# Northflank or Render (persistent volume, no 60 s timeout).

name: Deploy API to Vercel

on:
  push:
    branches: [master]
    paths:
      - "api/**"
      - "mandi_rdd/api/**"
      - "mandi_rdd/storage/**"
      - "mandi_rdd/data/**"   # DuckDB — redeploy API whenever the DB syncs
      - "requirements/api.txt"
      - "requirements-vercel.txt"
      - "vercel.json"
      - "pyproject.toml"   # Vercel Python runtime installs via uv from this
      - "uv.lock"

      - ".python-version"
      - ".github/workflows/deploy-vercel.yml"
  workflow_dispatch:          # manual trigger via GitHub UI

concurrency:
  group: deploy-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate vercel.json is valid JSON
        run: python -c "import json; json.load(open('vercel.json')); print('vercel.json OK')"

      - name: Validate api/index.py imports cleanly
        run: python -c "import ast; ast.parse(open('api/index.py').read()); print('api/index.py OK')"

      - name: Validate .python-version is set
        run: |
          if [ ! -f .python-version ]; then
            echo "::error ::Missing .python-version — create it with '3.12'"
            exit 1
          fi
          echo ".python-version: $(cat .python-version) OK"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      deploy_url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true                           # pull the DuckDB via Git LFS

      - name: Check LFS files are pulled (not pointers)
        run: |
          git lfs ls-files --long | head -5
          if [ -f mandi_rdd/data/mandi_iq.duckdb ]; then
            SIZE=$(stat --format=%s mandi_rdd/data/mandi_iq.duckdb 2>/dev/null || echo 0)
            if [ "$SIZE" -lt 1024 ]; then
              echo "::warning ::DuckDB file appears to be a Git LFS pointer (<1 KB) — did LFS pull succeed?"
            else
              echo "DuckDB: $(numfmt --to=iec $SIZE) OK"
            fi
          fi

      - name: Strip .git before build (LFS objects exceed Vercel's 500 MB bundle cap)
        run: |
          du -sh .git 2>/dev/null || true
          rm -rf .git
          echo ".git removed — LFS object store no longer counted in the function bundle"

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Verify VERCEL_TOKEN is configured
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "::error::VERCEL_TOKEN secret is not set — Vercel deploy skipped."
          echo "::error::1. Create a token at https://vercel.com/account/tokens"
          echo "::error::2. Add it as a repo secret: gh secret set VERCEL_TOKEN"
          exit 1

      - name: Link Vercel project (idempotent)
        if: env.VERCEL_TOKEN != ''
        run: |
          vercel link --yes --project=test-mandi || \
            echo "::warning::vercel link failed (project may not exist yet) — pull will retry"

      - name: Pull Vercel environment
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for production
        if: env.VERCEL_TOKEN != ''
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        id: deploy
        if: env.VERCEL_TOKEN != ''
        run: |
          OUTPUT=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "$OUTPUT"
          # Extract the production URL from the deploy output
          URL=$(echo "$OUTPUT" | grep -oP 'https://[a-zA-Z0-9.-]+\.vercel\.app' | head -1)
          if [ -n "$URL" ]; then
            echo "url=$URL" >> $GITHUB_OUTPUT
          fi

      - name: Smoke-test the deployment
        if: steps.deploy.outputs.deploy_url != ''
        env:
          URL: ${{ steps.deploy.outputs.deploy_url }}
        run: |
          echo "Smoke-testing $URL/health ..."
          for i in 1 2 3; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL/health" 2>/dev/null)
            if [ "$HTTP_CODE" = "200" ]; then
              echo " OK — /health returned 200"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_CODE — retrying in 5s..."
            sleep 5
          done
          echo "::warning ::Smoke-test failed — /health did not return 200 after 3 attempts"
          exit 1
        continue-on-error: true               # smoke-test failure is informational
