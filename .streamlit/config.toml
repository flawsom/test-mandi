# MandiIQ Dashboard — Streamlit Cloud Configuration
# This file is consumed by Streamlit Community Cloud (share.streamlit.io)
# and local development. For Cloud, the API URL is set via Secrets:
#   MANDIQ_API_URL = https://p01--mandiiq--zbvjrztgjqgw.code.run

[server]
maxUploadSize = 10
runOnSave = false

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#d7ff00"
backgroundColor = "#0a0814"
secondaryBackgroundColor = "#12101f"
textColor = "#e8ecf4"
font = "sans serif"

[client]
showSidebarNavigation = false
toolbarMode = "minimal"

